services:
  server1:
    build:
      dockerfile: Dockerfile
    container_name: duck_pbss
    restart: always
    env_file:
      - .env
    environment:
      - DB_PATH=/data/pbss.db
      - TEMP_DIR=/data/tmp
      - RETENTION_HOURS=24 # limpeza forçada de arquivos locais não confirmados após 24h
    volumes:
      - ./data:/data # sqlite + fila temporária de screenshots (persistente entre restarts)

