services:
  server1:
    # limite dimensionado sobre o RSS medido: RSS 12M; baixa screenshots do PunkBuster
    mem_limit: 256m
    pids_limit: 128
    build:
      dockerfile: Dockerfile
    container_name: duck_pbss
    restart: unless-stopped
    # SIGTERM -> SIGKILL em 30s (default do Docker = 10s): da tempo do Sender
    # drenar a fila (senderCloseTimeout = 25s em cmd/bot/main.go, amarrado
    # a este valor por cmd/bot/main_test.go) e sobram 5s pro resto do shutdown.
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      - DB_PATH=/data/pbss.db
      - TEMP_DIR=/data/tmp
      - RETENTION_HOURS=24 # limpeza forçada de arquivos locais não confirmados após 24h
      # Dead-man switch: push a cada 5min so com o gateway conectado
      # (internal/discord/kuma.go). O uptime-kuma foi ligado a esta rede em
      # 19/07 -- pelo host nao daria, o Kuma escuta so em 127.0.0.1.
      # KUMA_PUSH_URL saiu daqui em 01/08/2026: este arquivo e rastreado em
      # git e o token de push e segredo. Agora vem do .env (nao versionado).
      # O token exposto no historico foi rotacionado no Kuma na mesma operacao,
      # entao o que ficou no historico nao vale mais nada.
    volumes:
      - ./data:/data # sqlite + fila temporária de screenshots (persistente entre restarts)

